# Mahalliy ishga tushirish uchun:
#   docker compose up -d db redis          - faqat baza (kodni hostda ishga tushirasiz)
#   docker compose --profile app up -d     - butun ilova (gunicorn bilan)
name: zuno

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-zuno}
      POSTGRES_USER: ${DB_USER:-zuno}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylida berilishi kerak}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - zuno_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - zuno_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  zuno_pg_data:
  zuno_media:
